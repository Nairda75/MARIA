<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>As nossas fotos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@600;700&family=Montserrat:wght@600;800&display=swap">
<style>
:root{
  --sun:#f7b500; --ink:#fff6dc; --blush:#ffc2d4; --rose:#ff5c86; --brown:#33190a;
  --night-top:#0e2236; --night-mid:#1c3b5a; --night-low:#3b2d57;
  --display:"Cormorant Garamond",Georgia,serif; --hand:"Caveat","Segoe Script",cursive; --ui:"Montserrat",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night-top)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--ui);
  background:linear-gradient(180deg,var(--night-top),var(--night-mid) 55%,var(--night-low)) fixed;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
header{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:8px 22px}
.back{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;letter-spacing:.06em;opacity:.85}
.back:hover{opacity:1}
h1{margin:0;flex-basis:100%;font-family:var(--hand);font-weight:700;font-size:clamp(2.4rem,9vw,4rem);color:var(--blush);line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.sub{flex-basis:100%;margin:-6px 0 0;font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:.06em;opacity:.9}
.play{border:0;border-radius:999px;padding:12px 22px;background:var(--sun);color:var(--brown);font:800 .85rem var(--ui);letter-spacing:.12em;cursor:pointer;box-shadow:0 6px 18px rgba(217,130,0,.4)}
.play:focus-visible,.lb button:focus-visible,.card:focus-visible{outline:3px solid var(--blush);outline-offset:3px}
.play[hidden]{display:none}

#grid{max-width:1100px;margin:0 auto;columns:3 240px;column-gap:14px}
.card{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden;cursor:pointer;
  break-inside:avoid;position:relative;opacity:0;transform:translateY(26px) rotate(var(--tilt,0deg));
  animation:rise .9s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d,0s);
  box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-4px) scale(1.025) rotate(0);box-shadow:0 16px 34px rgba(0,0,0,.5)}
.card img{display:block;width:100%;height:auto;min-height:120px;background:rgba(255,255,255,.08)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-family:var(--hand);font-size:1.35rem;font-weight:700;color:var(--ink);
  background:linear-gradient(transparent,rgba(8,16,28,.75));text-align:left}
@keyframes rise{to{opacity:1;transform:translateY(0) rotate(var(--tilt,0deg))}}

#empty{max-width:520px;margin:12vh auto 0;text-align:center;font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.5;letter-spacing:.03em}
#empty small{display:block;margin-top:10px;font:600 .85rem var(--ui);opacity:.7;letter-spacing:.05em}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(6,12,22,.985);touch-action:pan-y}
.lb.open{display:flex}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{max-width:94vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:fadeimg .7s ease}
.stage img.kb{animation:fadeimg .7s ease,kenburns 5s ease-out forwards}
@keyframes fadeimg{from{opacity:0}to{opacity:1}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
.lb .capt{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--hand);font-weight:700;font-size:1.7rem;color:var(--blush);padding:0 16px;text-shadow:0 2px 10px #000}
.lb .count{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font:600 .85rem var(--ui);letter-spacing:.1em;opacity:.75}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:var(--ink);width:48px;height:48px;border-radius:50%;font-size:1.5rem;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}
.lb button:hover{background:rgba(255,255,255,.22)}
.lb .x{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.lb .prev{left:max(10px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .next{right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .auto{bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 52px);right:max(12px,env(safe-area-inset-right,0px));font-size:1rem}
@media (max-width:600px){#grid{columns:2 140px;column-gap:10px}.card{margin-bottom:10px}.lb .prev,.lb .next{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.card{animation-duration:.01s}.stage img.kb{animation:fadeimg .7s ease}}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">&larr; Voltar</a>
  <button class="play" id="slideshow" type="button" hidden>VER EM SEQUÊNCIA</button>
  <h1>As nossas fotos</h1>
  <p class="sub">Maria &amp; Adrian</p>
</header>

<main>
  <div id="grid"></div>
  <p id="empty" hidden>As fotos vão aparecer aqui.<small>Quando forem adicionadas, a galeria enche-se sozinha.</small></p>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto">
  <div class="stage" id="stage"></div>
  <span class="count" id="count"></span>
  <button class="x" id="close" type="button" aria-label="Fechar">&times;</button>
  <button class="prev" id="prev" type="button" aria-label="Anterior">&#8249;</button>
  <button class="next" id="next" type="button" aria-label="Seguinte">&#8250;</button>
  <button class="auto" id="auto" type="button" aria-label="Pausar ou retomar a sequência">&#10073;&#10073;</button>
  <div class="capt" id="capt"></div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var grid=$('#grid'),lb=$('#lb'),stage=$('#stage'),capt=$('#capt'),count=$('#count'),autoBtn=$('#auto');
  var photos=[],cur=0,timer=null,playing=false;

  fetch('photos.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){
    photos=(list||[]).map(function(p){return typeof p==='string'?{src:p,caption:''}:p}).filter(function(p){return p&&p.src});
    render();
  }).catch(function(){render()});

  function render(){
    if(!photos.length){$('#empty').hidden=false;return}
    $('#slideshow').hidden=false;
    photos.forEach(function(p,i){
      var b=document.createElement('button');b.type='button';b.className='card';
      b.style.setProperty('--d',(i*0.12).toFixed(2)+'s');
      b.style.setProperty('--tilt',((Math.random()*3-1.5)).toFixed(2)+'deg');
      b.setAttribute('aria-label','Abrir foto '+(i+1));
      var im=document.createElement('img');im.src=p.src;im.alt=p.caption||('Foto '+(i+1));im.loading='lazy';im.decoding='async';
      b.appendChild(im);
      if(p.caption){var c=document.createElement('span');c.className='cap';c.textContent=p.caption;b.appendChild(c)}
      b.addEventListener('click',function(){open(i,false)});
      grid.appendChild(b);
    });
  }

  function show(i,kb){
    cur=(i+photos.length)%photos.length;var p=photos[cur];
    var im=new Image();im.alt=p.caption||'';im.src=p.src;if(kb)im.className='kb';
    stage.innerHTML='';stage.appendChild(im);
    capt.textContent=p.caption||'';count.textContent=(cur+1)+' / '+photos.length;
    var nx=photos[(cur+1)%photos.length];if(nx){var pre=new Image();pre.src=nx.src}
  }
  function open(i,auto){lb.classList.add('open');document.body.style.overflow='hidden';show(i,auto);setPlaying(auto);$('#close').focus()}
  function close(){lb.classList.remove('open');document.body.style.overflow='';setPlaying(false)}
  function step(d){show(cur+d,playing);if(playing)restart()}
  function restart(){clearInterval(timer);timer=setInterval(function(){show(cur+1,true)},5000)}
  function setPlaying(on){
    playing=on;clearInterval(timer);
    autoBtn.innerHTML=on?'&#10073;&#10073;':'&#9654;';
    if(on)restart();
  }

  $('#slideshow').addEventListener('click',function(){open(0,true)});
  $('#close').addEventListener('click',close);
  $('#prev').addEventListener('click',function(){step(-1)});
  $('#next').addEventListener('click',function(){step(1)});
  autoBtn.addEventListener('click',function(){setPlaying(!playing);if(playing)show(cur,true)});
  lb.addEventListener('click',function(e){if(e.target===lb||e.target===stage)close()});
  addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
  });
  var sx=null;
  lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){
    if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;
    if(Math.abs(dx)>50)step(dx<0?1:-1);
  });
})();
</script>
</body>
</html>
